name: secrets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed from the tip is still a secret if it
          # is reachable in an earlier commit.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSLo /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      # Runs BEFORE the scan: a misconfigured .gitleaks.toml reports "no leaks
      # found" and exits 0, so a green scan proves nothing on its own.
      - name: Self-test the scanner
        run: npm run scan:secrets:selftest

      - name: Scan full history
        run: gitleaks git --no-banner --redact --exit-code 1

      - name: Scan working tree
        run: gitleaks dir --no-banner --redact --exit-code 1
